[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "histox-contrib"
dynamic = ["version"]
description = "Community-contributed GPL-3 extensions for HistoX."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Your Name", email = "your@email.com" }
]
requires-python = ">=3.8"
dependencies = [
    "histox>=0.2.0",
    "numpy",
    "pillow>=6.0.0",
    "gdown",
    "torch",
    "torchvision",
    "timm",
    "huggingface_hub",
    "transformers",
    "fastai",
    "scikit-misc",
]

[project.urls]
Homepage = "https://github.com/your-username/histox-contrib"

[project.entry-points."histox.plugins"]
extras = "histox_contrib:register_extras"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
write_to = "histox_contrib/_version.py"
